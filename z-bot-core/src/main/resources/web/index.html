<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>z-bot 控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f0f0f;
            --sidebar-bg: #1a1a1a;
            --panel-bg: #1e1e1e;
            --border: #2a2a2a;
            --text: #e0e0e0;
            --text-dim: #888;
            --accent: #6b8afd;
            --accent-dim: #4a6bcc;
            --green: #3ddc84;
            --yellow: #ffc107;
            --red: #ff5252;
            --tool-call: #ffa726;
            --tool-ok: #66bb6a;
            --user-msg-bg: #1a2d1a;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== TOPBAR ===== */
        #topbar {
            height: 48px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
            flex-shrink: 0;
        }

        #topbar .logo {
            font-weight: 700;
            font-size: 15px;
            color: var(--accent);
        }

        #topbar .logo span {
            color: var(--text-dim);
            font-weight: 400;
        }

        #topbar .status-info {
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            gap: 12px;
        }

        #topbar .status-info .badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
        }

        #topbar .status-info .model-badge {
            background: var(--accent-dim);
            color: white;
        }

        #topbar .status-info .tools-badge {
            background: #2a4a2a;
            color: var(--green);
        }

        #topbar .actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        #topbar button {
            background: #2a2a2a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        #topbar button:hover {
            background: #333;
        }

        /* ===== MAIN ===== */
        #main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        #sidebar {
            width: 220px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-section {
            border-bottom: 1px solid var(--border);
        }

        .sidebar-section-title {
            padding: 10px 14px 6px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            font-weight: 600;
        }

        .sidebar-item {
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }

        .sidebar-item:hover {
            background: #222;
        }

        .sidebar-item.active {
            background: #252525;
            color: var(--accent);
        }

        .sidebar-item .icon {
            font-size: 14px;
        }

        .sidebar-item .count {
            margin-left: auto;
            font-size: 11px;
            color: var(--text-dim);
            background: #2a2a2a;
            padding: 1px 6px;
            border-radius: 8px;
        }

        /* ===== SIDEBAR SEARCH ===== */
        .session-search {
            margin: 0 10px 8px;
            padding: 6px 8px;
            width: calc(100% - 20px);
            background: #111;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 12px;
            outline: none;
        }

        .session-search:focus {
            border-color: var(--accent);
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            width: min(760px, 92vw);
            max-height: 84vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h3 {
            font-size: 14px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 18px;
            cursor: pointer;
        }

        .modal-close:hover {
            color: var(--text);
        }

        .modal-body {
            padding: 14px 16px;
            overflow-y: auto;
            font-size: 13px;
        }

        .modal-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .modal-toolbar input,
        .modal-toolbar textarea {
            background: #111;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 12px;
            outline: none;
            font-family: inherit;
        }

        .modal-toolbar input:focus,
        .modal-toolbar textarea:focus {
            border-color: var(--accent);
        }

        .mini-btn {
            background: #2a2a2a;
            border: none;
            color: var(--text);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 11px;
            cursor: pointer;
        }

        .mini-btn:hover {
            background: #333;
        }

        .mini-btn.primary {
            background: var(--accent-dim);
        }

        .mini-btn.primary:hover {
            background: var(--accent);
        }

        .modal-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .modal-table th,
        .modal-table td {
            text-align: left;
            padding: 6px 8px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
            word-break: break-all;
        }

        .modal-table th {
            color: var(--text-dim);
            font-weight: 600;
        }

        .state-on {
            color: var(--green);
        }

        .state-off {
            color: var(--yellow);
        }

        .dim {
            color: var(--text-dim);
        }

        /* ===== CHAT AREA ===== */
        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-track {
            background: transparent;
        }

        #messages::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        .msg {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }

        .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg.assistant {
            align-self: flex-start;
        }

        .msg .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            font-weight: 700;
        }

        .msg.user .avatar {
            background: var(--accent);
            color: white;
        }

        .msg.assistant .avatar {
            background: #2a2a2a;
            color: var(--text-dim);
            border: 1px solid var(--border);
        }

        .msg .bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg.user .bubble {
            background: var(--user-msg-bg);
            border-bottom-right-radius: 4px;
        }

        .msg.assistant .bubble {
            background: var(--panel-bg);
            border-bottom-left-radius: 4px;
        }

        /* tool call bubble */
        .msg .bubble.tool-call {
            border-left: 3px solid var(--tool-call);
        }

        .msg .bubble.tool-result {
            border-left: 3px solid var(--tool-ok);
            font-size: 13px;
        }

        .msg .bubble.tool-error {
            border-left: 3px solid var(--red);
        }

        .msg .bubble.thought {
            border-left: 3px solid var(--accent-dim);
            color: var(--text-dim);
            font-size: 13px;
        }

        /* ===== INPUT AREA ===== */
        #input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            background: var(--sidebar-bg);
            flex-shrink: 0;
        }

        #input-area .confirm-bar {
            display: none;
            background: #2a1a0a;
            border: 1px solid var(--yellow);
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--yellow);
        }

        #input-area .confirm-bar.show {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: space-between;
        }

        #input-area .confirm-bar button {
            padding: 4px 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 12px;
        }

        #input-area .confirm-bar .approve-btn {
            background: var(--green);
            color: #000;
        }

        #input-area .confirm-bar .deny-btn {
            background: #333;
            color: var(--text);
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        #msg-input {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            padding: 10px 14px;
            font-size: 14px;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
            font-family: inherit;
        }

        #msg-input:focus {
            border-color: var(--accent-dim);
        }

        #send-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 0 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        #send-btn:hover {
            background: var(--accent-dim);
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        /* ===== RIGHT PANEL ===== */
        #right-panel {
            width: 260px;
            background: var(--sidebar-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        #right-panel::-webkit-scrollbar {
            width: 5px;
        }

        #right-panel::-webkit-scrollbar-thumb {
            background: #333;
        }

        .panel-section {
            border-bottom: 1px solid var(--border);
        }

        .panel-title {
            padding: 10px 14px 6px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title button {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 11px;
            padding: 0;
        }

        .panel-title button:hover {
            color: var(--text);
        }

        .panel-row {
            padding: 7px 14px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-row .label {
            color: var(--text-dim);
        }

        .panel-row .value {
            color: var(--text);
            font-weight: 500;
        }

        .tool-item {
            padding: 6px 14px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-item .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
        }

        .tool-item .name {
            font-family: monospace;
        }

        /* ===== TYPING INDICATOR ===== */
        .typing {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 14px;
        }

        .typing-dots {
            display: flex;
            gap: 3px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-dim);
            animation: bounce 1.2s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-4px);
            }
        }

        /* ===== SESSION ITEM ===== */
        .session-item {
            padding: 8px 14px;
            font-size: 12px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: background 0.15s;
        }

        .session-item:hover {
            background: #222;
        }

        .session-item.active {
            background: #1e241e;
            border-left-color: var(--green);
        }

        .session-item .session-title {
            font-size: 12px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-item .session-time {
            font-size: 10px;
            color: var(--text-dim);
        }

        /* ===== WELCOME ===== */
        #welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            gap: 12px;
        }

        #welcome h2 {
            font-size: 22px;
            color: var(--text);
            font-weight: 600;
        }

        #welcome p {
            font-size: 14px;
        }

        .shortcuts {
            display: grid;
            grid-template-columns: repeat(2, 180px);
            gap: 8px;
            margin-top: 16px;
        }

        .shortcut {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .shortcut .key {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            font-family: monospace;
            color: var(--text-dim);
        }

        .shortcut .desc {
            font-size: 12px;
        }

        /* ===== UTILS ===== */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
    <div class="logo">z-bot <span>/ 控制台</span></div>
    <div class="status-info">
        <span class="badge model-badge" id="model-badge">连接中…</span>
        <span class="badge tools-badge" id="tools-badge">9 tools</span>
        <span class="badge" id="session-badge" style="background:#2a2a2a;color:var(--text-dim)">session: new</span>
    </div>
    <div class="actions">
        <button onclick="clearSession()">🗑 清空会话</button>
        <button onclick="reloadTools()">🔄 刷新状态</button>
    </div>
</div>

<!-- MAIN -->
<div id="main">

    <!-- SIDEBAR: Sessions -->
    <div id="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-section-title">会话</div>
            <div class="sidebar-item active" id="new-session-btn" onclick="newSession()">
                <span class="icon">✏️</span> 新建会话
            </div>
            <input class="session-search" id="session-search" type="text"
                   placeholder="🔍 搜索会话..." oninput="renderSessions()">
            <div id="session-list">
                <!-- sessions loaded dynamically -->
            </div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">管理</div>
            <div class="sidebar-item" onclick="openModal('models')">
                <span class="icon">📦</span> 模型目录
            </div>
            <div class="sidebar-item" onclick="openModal('skills')">
                <span class="icon">🧩</span> 技能
            </div>
            <div class="sidebar-item" onclick="openModal('cron')">
                <span class="icon">⏰</span> 定时任务
            </div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">工具集</div>
            <div id="tool-list-sidebar"></div>
        </div>
    </div>

    <!-- CHAT -->
    <div id="chat-area">
        <div id="messages">
            <div id="welcome">
                <h2>🤖 z-bot 控制台</h2>
                <div class="shortcuts">
                    <div class="shortcut"><span class="key">Enter</span><span class="desc">发送消息</span></div>
                    <div class="shortcut"><span class="key">Shift+Enter</span><span class="desc">换行</span></div>
                    <div class="shortcut"><span class="key">Ctrl+L</span><span class="desc">清空会话</span></div>
                    <div class="shortcut"><span class="key">Ctrl+N</span><span class="desc">新建会话</span></div>
                </div>
            </div>
        </div>

        <!-- INPUT -->
        <div id="input-area">
            <div class="confirm-bar" id="confirm-bar">
                <span id="confirm-text">⚠️ 危险命令等待确认...</span>
                <div>
                    <button class="approve-btn" onclick="approveLast()">✅ 确认执行</button>
                    <button class="deny-btn" onclick="denyLast()">❌ 取消</button>
                </div>
            </div>
            <div class="input-row">
                <textarea id="msg-input" placeholder="输入消息... (Shift+Enter 换行)" rows="1"></textarea>
                <button id="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <!-- RIGHT PANEL: Info -->
    <div id="right-panel">
        <div class="panel-section">
            <div class="panel-title">🤖 模型</div>
            <div class="panel-row"><span class="label">当前模型</span><span class="value" id="panel-model">—</span>
            </div>
            <div class="panel-row"><span class="label">Provider</span><span class="value"
                                                                            id="panel-provider">minimax</span></div>
        </div>
        <div class="panel-section">
            <div class="panel-title">🔧 工具
                <button onclick="reloadTools()">↻</button>
            </div>
            <div id="tool-list-panel"></div>
        </div>
        <div class="panel-section">
            <div class="panel-title">📊 统计</div>
            <div class="panel-row"><span class="label">消息数</span><span class="value" id="msg-count">0</span></div>
            <div class="panel-row"><span class="label">Steps</span><span class="value" id="step-count">0</span></div>
        </div>
        <div class="panel-section">
            <div class="panel-title">⏱ 快捷命令</div>
            <!-- P19 单源：这一栏不再手写清单（旧版在这里抄了 5 行，与 /help 那 6 行、
                 与真有水流的分支三者各漂各的）。内容来自 GET /api/commands 里 endpoints 含
                 "web" 的那些行，渲染函数见 renderQuickCommands()。 -->
            <div id="quick-commands" class="panel-row" style="flex-direction:column;gap:4px;align-items:flex-start"></div>
        </div>
    </div>
</div>

<!-- MODAL: 管理视图 (模型 / 技能 / 定时任务) -->
<div class="modal-overlay" id="modal-overlay" onclick="if (event.target === this) closeModal()">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-title">—</h3>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
    </div>
</div>

<script>
    // ===== STATE =====
    let currentSessionId = 'new';
    let isStreaming = false;
    let fullReply = '';
    let lastToolCall = null; // {toolName, argsJson, reason}
    let totalSteps = 0;
    let msgCount = 0;
    let sessions = [];

    // ===== DOM =====
    const $messages = document.getElementById('messages');
    const $welcome = document.getElementById('welcome');
    const $input = document.getElementById('msg-input');
    const $sendBtn = document.getElementById('send-btn');
    const $confirmBar = document.getElementById('confirm-bar');
    const $confirmText = document.getElementById('confirm-text');
    const $sessionList = document.getElementById('session-list');

    // ===== INIT =====
    window.addEventListener('DOMContentLoaded', () => {
        loadStatus();
        loadTools();
        loadSessions();
        $input.focus();
    });

    // ===== SESSIONS =====
    async function loadSessions() {
        try {
            const r = await fetch('/api/sessions');
            sessions = await r.json();
            renderSessions();
        } catch (e) {
            console.error('load sessions error', e);
        }
    }

    function renderSessions() {
        const qEl = document.getElementById('session-search');
        const q = ((qEl && qEl.value) || '').toLowerCase().trim();
        let list = sessions || [];
        if (q) {
            list = list.filter(s => ((s.title || '') + ' ' + (s.id || '')).toLowerCase().indexOf(q) >= 0);
        }
        if (list.length === 0) {
            const tip = !sessions || sessions.length === 0 ? '暂无历史会话' : '无匹配会话';
            $sessionList.innerHTML = '<div class="session-item" style="color:var(--text-dim);font-size:12px;padding:8px 14px">' + tip + '</div>';
            return;
        }
        $sessionList.innerHTML = list.map(s => {
            const active = s.id === currentSessionId ? ' active' : '';
            const time = s.createdAt ? s.createdAt : '';
            const title = s.title && s.title !== '新会话' ? s.title : '新会话 ' + time;
            return `<div class="session-item${active}" onclick="switchSession('${s.id}')">
                <div class="session-title">${escapeHtml(title)}</div>
                <div class="session-time">${time} (${s.messageCount}条)</div>
            </div>`;
        }).join('');
    }

    async function newSession() {
        try {
            const r = await fetch('/api/sessions', {method: 'POST'});
            const data = await r.json();
            currentSessionId = data.id;
            document.getElementById('session-badge').textContent = 'session: ' + currentSessionId.substring(0, 12);
            $messages.innerHTML = '';
            $welcome.classList.remove('hidden');
            msgCount = 0;
            totalSteps = 0;
            lastToolCall = null;
            updateStats();
            await loadSessions();
        } catch (e) {
            console.error('new session error', e);
        }
    }

    async function switchSession(id) {
        try {
            const r = await fetch('/api/session/switch', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id})
            });
            const data = await r.json();
            if (data.ok) {
                currentSessionId = id;
                document.getElementById('session-badge').textContent = 'session: ' + id.substring(0, 12);
                // Load messages
                const mr = await fetch('/api/session/messages?id=' + id);
                const msgs = await mr.json();
                $messages.innerHTML = '';
                $welcome.classList.add('hidden');
                msgCount = 0;
                for (const m of msgs) {
                    if (m.role === 'user') {
                        appendMsg('user', m.content);
                        msgCount++;
                    } else if (m.role === 'assistant' && m.content) {
                        if (m.contentType === 'tool_call') {
                            appendMsg('assistant', `[Tool] ${m.toolName}\nargs=${m.content}`, 'tool-call');
                        } else if (m.contentType === 'tool_result') {
                            appendMsg('assistant', m.content, 'tool-result');
                        } else if (!m.isFinal) {
                            // skip intermediate
                        } else {
                            appendMsg('assistant', m.content);
                        }
                    }
                }
                updateStats();
                renderSessions();
            }
        } catch (e) {
            console.error('switch session error', e);
        }
    }

    async function deleteSession(id) {
        if (!confirm('删除此会话？')) return;
        try {
            await fetch('/api/session/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id})
            });
            if (id === currentSessionId) {
                await newSession();
            }
            await loadSessions();
        } catch (e) {
            console.error('delete session error', e);
        }
    }

    // ===== STATUS =====
    async function loadStatus() {
        try {
            const r = await fetch('/bot/status');
            const text = await r.text();
            // 纯文本: "Bot running, model=xxx, tools=11, provider=minimax, instance=local"
            const modelMatch = text.match(/model=([^,]+)/);
            const toolsMatch = text.match(/tools=(\d+)/);
            if (modelMatch) {
                const m = modelMatch[1];
                document.getElementById('model-badge').textContent = m;
                document.getElementById('panel-model').textContent = m;
            }
            if (toolsMatch) {
                document.getElementById('tools-badge').textContent = toolsMatch[1] + ' tools';
            }
        } catch (e) {
            console.error('status error', e);
        }
    }

    // ===== TOOLS =====
    async function loadTools() {
        let tools;
        try {
            const r = await fetch('/bot/tools');
            tools = await r.json();
        } catch (e) {
            console.error('load tools error', e);
            return;
        }
        const html = tools.map(t => `<div class="tool-item"><span class="dot"></span><span class="name">${escapeHtml(t.name)}</span><span style="color:var(--text-dim);margin-left:4px">${escapeHtml(t.description || '')}</span></div>`).join('');
        document.getElementById('tool-list-panel').innerHTML = html;
        document.getElementById('tool-list-sidebar').innerHTML = tools.map(t => `<div class="sidebar-item"><span class="icon">⚙️</span>${escapeHtml(t.name)}</div>`).join('');
    }

    // ===== SEND =====
    async function sendMessage() {
        const text = $input.value.trim();
        if (!text || isStreaming) return;

        // slash commands
        if (text.startsWith('/')) {
            await handleSlash(text);
            $input.value = '';
            return;
        }

        // hide welcome
        $welcome.classList.add('hidden');

        // append user msg
        appendMsg('user', text);
        $input.value = '';
        msgCount++;
        updateStats();

        // stream
        isStreaming = true;
        $sendBtn.disabled = true;
        fullReply = '';

        // typing indicator
        const typingId = showTyping();

        try {
            const res = await fetch('/bot/chat/stream', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: text}),
            });
            const ctype = res.headers.get('content-type') || '';
            if (!res.ok || ctype.indexOf('text/event-stream') < 0) {
                removeTyping(typingId);
                appendMsg('assistant', '错误：' + (await res.text()), 'error');
            } else {
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let currentEvent = '';

                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, {stream: true});
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('event: ')) {
                            currentEvent = line.substring(7).trim();
                        } else if (line.startsWith('data: ')) {
                            const data = line.substring(6);
                            if (currentEvent) {
                                processEvent(currentEvent, data, typingId);
                                currentEvent = '';
                            }
                        }
                    }
                }
            }
        } catch (e) {
            removeTyping(typingId);
            appendMsg('assistant', '错误：' + e.message, 'error');
        }

        isStreaming = false;
        $sendBtn.disabled = false;
        updateStats();
        // Refresh sessions after chat
        await loadSessions();
    }

    function processEvent(type, data, typingId) {
        const text = unescapeData(data);
        if (type === 'thought') {
            // 思考过程只作为进度提示，最终答案由 final 呈现
        } else if (type === 'tool_call') {
            removeTyping(typingId);
            lastToolCall = parseToolCall(text);
            const tc = lastToolCall;
            appendMsg('assistant', `[Tool] ${tc.name}\nargs=${tc.args}`, 'tool-call');
        } else if (type === 'tool_result') {
            const success = text.includes('OK:');
            const result = text.replace(/^\[.*?\] /, '');
            appendMsg('assistant', result, success ? 'tool-result' : 'tool-error');
        } else if (type === 'final') {
            removeTyping(typingId);
            fullReply += text;
            appendMsg('assistant', text);
            msgCount++;
        } else if (type === 'step') {
            totalSteps++;
            updateStats();
        } else if (type === 'confirm') {
            removeTyping(typingId);
            const c = parseConfirm(text);
            lastToolCall = c;
            $confirmText.textContent = `⚠️ ${c.name} 等待确认：${c.reason}`;
            $confirmBar.classList.add('show');
        } else if (type === 'done') {
            removeTyping(typingId);
        } else if (type === 'steer') {
            // 服务端在中途插入了转向指令，界面必须显式回应，不能像旧版那样吞帧
            removeTyping(typingId);
            appendMsg('assistant', '🧭 已注入转向：' + stripPrefix(text, '[steer]'), 'steer');
        } else if (type === 'compact') {
            removeTyping(typingId);
            appendMsg('assistant', '🗜 上下文压缩：' + stripPrefix(text, '[compact]'), 'compact');
        } else if (type === 'error') {
            removeTyping(typingId);
            appendMsg('assistant', '❌ ' + text, 'error');
        } else {
            // 未知事件名 = 服务端词汇表又长了而这里没跟上。宁可显式报出来，
            // 也不要静默丢帧（静默丢弃正是 D-P28-3 的成因）。
            removeTyping(typingId);
            appendMsg('assistant', '❔ 未处理的事件 ' + type + '：' + text, 'error');
        }
    }

    // 事件帧的 data 带 "[name] " 前缀（服务端 HttpChannel#frame 约定），显示时脱掉。
    function stripPrefix(text, prefix) {
        return text.indexOf(prefix) === 0 ? text.substring(prefix.length).trim() : text;
    }

    function parseToolCall(data) {
        // format: "[tool] echo args={...}"
        const match = data.match(/^\[tool\] (\w+)\s+args=(.*)/);
        if (match) return {name: match[1], args: match[2]};
        return {name: data, args: '{}'};
    }

    function parseConfirm(data) {
        // format: "[confirm] tool=exec args={...} reason=..."
        const match = data.match(/^\[confirm\] tool=(\S+)\s+args=(.*?)\s+reason=([\s\S]*)$/);
        if (match) return {name: match[1], args: match[2], reason: match[3]};
        return {name: data, args: '{}', reason: '高危操作'};
    }

    // ===== COMMAND TABLE (P19 单源消费端) =====
    // 这一页不再自己抄第二份命令清单。清单只有一处：服务端 GET /api/commands（它吐的就是
    // CommandCatalog 整张表，每行自带 endpoints 可见性段）。本页只取 endpoints 含 "web" 的行。
    //
    // "广告即兑现"由 CommandSurfaceConsistencyTest 钉住：它把这个文件里 handleSlash 实际
    // 有分支的那组命令名，和 CommandCatalog 的 WEB 段逐名字比对。
    //  ⇒ 在这里加一条没分支的广告、或在 handleSlash 加一条没登记的分支，都会红。
    let WEB_COMMANDS = [];

    async function loadCommands() {
        try {
            const r = await fetch('/api/commands');
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const rows = await r.json();
            WEB_COMMANDS = rows.filter(row => row && !row.aliasOf
                && Array.isArray(row.endpoints) && row.endpoints.indexOf('web') >= 0);
        } catch (e) {
            // 取不到就什么都不广告 —— 宁可空表，也不退回手抄清单（抄的那份正是漂移的源头）。
            WEB_COMMANDS = [];
        }
        renderQuickCommands();
        return WEB_COMMANDS;
    }

    function renderQuickCommands() {
        const box = document.getElementById('quick-commands');
        if (!box) return;
        box.innerHTML = WEB_COMMANDS.map(row =>
            `<code style="font-size:11px;color:var(--text-dim)">${escapeHtml(row.name)} — ${escapeHtml(row.description || '')}</code>`
        ).join('');
    }

    function commandHelpText() {
        if (!WEB_COMMANDS.length) {
            return '命令表没取到（GET /api/commands 不可达）。本页不保留手抄的备用清单。';
        }
        const width = WEB_COMMANDS.reduce((n, row) => Math.max(n, (row.name || '').length), 0);
        return WEB_COMMANDS.map(row =>
            `  ${(row.name || '').padEnd(width)} — ${row.description || ''}`).join('\n');
    }

    // ===== SLASH COMMANDS =====
    async function handleSlash(text) {
        const cmd = text.trim().toLowerCase();
        if (cmd === '/new') {
            newSession();
        } else if (cmd === '/clear') {
            clearSession();
        } else if (cmd === '/status') {
            await loadStatus();
            appendMsg('assistant', '✅ 状态已刷新');
        } else if (cmd === '/tools') {
            // 工具表必须来自后端 /bot/tools（Toolkit 单源）。旧版在这里硬编码了五个工具名，
            // 其中 exec/search 根本不在本实例的 Toolkit 里 —— 广告出去的字段没有兑现路径。
            try {
                const r = await fetch('/bot/tools');
                const tools = await r.json();
                const lines = tools.map(t => `  ${t.name} — ${t.description}`);
                appendMsg('assistant', `🔧 本实例可用工具 ${tools.length} 个：\n` +
                    (lines.length ? lines.join('\n') : '  （无）') +
                    '\n高危工具需 /confirm 审批');
            } catch (e) {
                appendMsg('assistant', '❌ 读取 /bot/tools 失败：' + e.message, 'error');
            }
        } else if (cmd === '/help') {
            // P19 起不再手写这份清单（旧版这里抄了 6 行，其中 /exit 本页根本没有分支，
            // 却没写它真接住的 /help 以外的差异 —— p28 WIRING.md §3.4/§3.5 量的就是这两笔）。
            appendMsg('assistant', `📋 命令列表（来自 /api/commands 的 web 段）：\n${commandHelpText()}`);
        } else if (cmd.startsWith('/confirm')) {
            if (lastToolCall) {
                await approveLast();
            } else {
                appendMsg('assistant', '没有待确认的危险命令');
            }
        } else {
            appendMsg('assistant', '未知命令: ' + text + '\n输入 /help 查看所有命令');
        }
    }

    // ===== CONFIRM =====
    async function approveLast() {
        if (!lastToolCall) {
            appendMsg('assistant', '没有待确认的危险命令');
            return;
        }
        const {name, args} = lastToolCall;
        let text;
        try {
            const res = await fetch('/bot/confirm', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({toolName: name, argsJson: args}),
            });
            text = await res.text();
        } catch (e) {
            appendMsg('assistant', '确认执行失败：' + e.message, 'error');
            return;
        }
        // 确认成功才收起横条；失败（如并发请求已消费掉这次确认）保留重试入口
        $confirmBar.classList.remove('show');
        lastToolCall = null;
        const failed = text.startsWith('Error:') || text.startsWith('执行失败');
        appendMsg('assistant', (failed ? '⚠️ ' : '✅ 已确认并执行 ') + `[${name}]：\n` + text,
                failed ? 'tool-error' : 'tool-result');
    }

    function denyLast() {
        $confirmBar.classList.remove('show');
        appendMsg('assistant', '❌ 已取消危险命令执行', 'error');
        lastToolCall = null;
    }

    // ===== SESSION =====
    async function newSession() {
        $messages.innerHTML = '';
        $welcome.classList.remove('hidden');
        msgCount = 0;
        totalSteps = 0;
        lastToolCall = null;
        updateStats();
        try {
            await fetch('/bot/clear');
        } catch (e) {
        }
        currentSessionId = 'new_' + Date.now();
        document.getElementById('session-badge').textContent = 'session: new';
    }

    async function clearSession() {
        await newSession();
        appendMsg('assistant', '🧹 记忆已清空');
    }

    // ===== APPEND MSG =====
    function appendMsg(role, content, extraClass) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        const avatar = role === 'user' ? '👤' : '🤖';
        div.innerHTML = `<div class="avatar">${avatar}</div><div class="bubble ${extraClass || ''}">${escapeHtml(content)}</div>`;
        $messages.appendChild(div);
        $messages.scrollTop = $messages.scrollHeight;
    }

    function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    }

    // SSE 的 data: 行不允许裸换行，服务端把 \n 转义成两字符，这里还原
    function unescapeData(s) {
        return s.replace(/\\n/g, '\n');
    }

    // ===== TYPING =====
    function showTyping() {
        const id = 'typing-' + Date.now();
        const div = document.createElement('div');
        div.id = id;
        div.className = 'msg assistant';
        div.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="typing"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>`;
        $messages.appendChild(div);
        $messages.scrollTop = $messages.scrollHeight;
        return id;
    }

    function removeTyping(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    // ===== STATS =====
    function updateStats() {
        document.getElementById('msg-count').textContent = msgCount;
        document.getElementById('step-count').textContent = totalSteps;
    }

    // ===== RELOAD =====
    async function reloadTools() {
        await loadStatus();
        await loadTools();
        appendMsg('assistant', '🔄 状态已刷新');
    }

    // ===== MODAL (模型目录 / 技能 / 定时任务) =====
    let currentModal = null;
    const MODAL_TITLES = {models: '📦 模型目录', skills: '🧩 技能', cron: '⏰ 定时任务'};

    function openModal(kind) {
        currentModal = kind;
        document.getElementById('modal-title').textContent = MODAL_TITLES[kind] || kind;
        document.getElementById('modal-overlay').classList.add('open');
        if (kind === 'models') loadModelsView();
        else if (kind === 'skills') loadSkillsView();
        else if (kind === 'cron') loadCronView();
    }

    function closeModal() {
        currentModal = null;
        document.getElementById('modal-overlay').classList.remove('open');
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && currentModal) closeModal();
    });

    // 属性值转义（escapeHtml 不处理引号，放进 onclick/data-* 会炸）
    function attrEsc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    async function loadModelsView(refresh) {
        const $body = document.getElementById('modal-body');
        $body.innerHTML = '<div class="dim">加载中…</div>';
        try {
            const r = await fetch('/api/models' + (refresh ? '?refresh=1' : ''));
            const data = await r.json();
            const rows = (data.models || []).map(m => `<tr>
                <td>${escapeHtml(m.id || '')}</td>
                <td>${escapeHtml(m.displayName || '')}</td>
                <td>${m.contextWindow || '—'}</td>
                <td>${(m.capabilities || []).join(', ')}</td>
            </tr>`).join('');
            const staleTip = data.stale ? ' · <span class="state-off">缓存已过期</span>' : '';
            $body.innerHTML = `
                <div class="modal-toolbar">
                    <span class="dim">provider: ${escapeHtml(data.provider || '?')} · 当前: ${escapeHtml(data.model || '?')} · ${data.count || 0} 个模型${staleTip}</span>
                    <button class="mini-btn" onclick="loadModelsView(false)">🔄 刷新缓存</button>
                    <button class="mini-btn primary" onclick="loadModelsView(true)">⚡ 强制重拉</button>
                </div>
                ${rows ? `<table class="modal-table">
                    <tr><th>ID</th><th>名称</th><th>上下文窗口</th><th>能力</th></tr>${rows}
                </table>` : '<div class="dim">目录为空</div>'}`;
        } catch (e) {
            $body.innerHTML = '<div class="state-off">加载失败: ' + escapeHtml(e.message) + '</div>';
        }
    }

    async function loadSkillsView() {
        const $body = document.getElementById('modal-body');
        $body.innerHTML = '<div class="dim">加载中…</div>';
        try {
            const r = await fetch('/api/skill/list');
            const data = await r.json();
            const codes = data.skillCodes || [];
            $body.innerHTML = `
                <div class="modal-toolbar">
                    <span class="dim">instance: ${escapeHtml(data.instanceCode || 'local')} · ${data.count || 0} 个已安装技能</span>
                    <button class="mini-btn primary" onclick="syncSkills()">⬇️ 从中心同步</button>
                </div>
                ${codes.length ? `<table class="modal-table">
                    <tr><th>#</th><th>技能 code</th></tr>
                    ${codes.map((c, i) => `<tr><td>${i + 1}</td><td>${escapeHtml(c)}</td></tr>`).join('')}
                </table>` : '<div class="dim">暂无已安装技能</div>'}`;
        } catch (e) {
            $body.innerHTML = '<div class="state-off">加载失败: ' + escapeHtml(e.message) + '</div>';
        }
    }

    async function syncSkills() {
        try {
            const r = await fetch('/api/skill/sync');
            const data = await r.json();
            if (data.ok) {
                await loadSkillsView();
            } else {
                alert('同步失败: ' + (data.error || 'center 未配置'));
            }
        } catch (e) {
            alert('同步失败: ' + e.message);
        }
    }

    async function loadCronView() {
        const $body = document.getElementById('modal-body');
        $body.innerHTML = '<div class="dim">加载中…</div>';
        try {
            const r = await fetch('/api/cron');
            const data = await r.json();
            if (data.error) {
                $body.innerHTML = '<div class="state-off">' + escapeHtml(data.error) + '</div>';
                return;
            }
            const jobs = data.jobs || [];
            const rows = jobs.map(j => `<tr>
                <td>${escapeHtml(j.name || '')}<div class="dim" style="font-size:10px">${escapeHtml(j.id || '')}</div></td>
                <td><code>${escapeHtml(j.schedule || '')}</code></td>
                <td class="${j.enabled ? 'state-on' : 'state-off'}">${j.enabled ? '运行中' : '已暂停'}</td>
                <td>${escapeHtml(j.lastRun || '—')}<div class="dim">${escapeHtml((j.lastResult || '').substring(0, 80))}</div></td>
                <td style="white-space:nowrap">
                    <button class="mini-btn" data-id="${attrEsc(j.id)}"
                            onclick="cronAction('${j.enabled ? 'pause' : 'resume'}', this.dataset.id)">${j.enabled ? '⏸' : '▶'}</button>
                    <button class="mini-btn" data-id="${attrEsc(j.id)}"
                            onclick="if (confirm('删除此定时任务？')) cronAction('remove', this.dataset.id)">🗑</button>
                </td>
            </tr>`).join('');
            $body.innerHTML = `
                <div class="modal-toolbar">
                    <input id="cron-name" placeholder="名称" size="12">
                    <input id="cron-schedule" placeholder="every 5m / daily 08:00" size="18">
                    <input id="cron-prompt" placeholder="任务 prompt" size="30">
                    <button class="mini-btn primary" onclick="cronAdd()">➕ 添加</button>
                </div>
                ${jobs.length ? `<table class="modal-table">
                    <tr><th>任务</th><th>调度</th><th>状态</th><th>上次运行</th><th>操作</th></tr>${rows}
                </table>` : '<div class="dim">暂无定时任务</div>'}`;
        } catch (e) {
            $body.innerHTML = '<div class="state-off">加载失败: ' + escapeHtml(e.message) + '</div>';
        }
    }

    async function cronAction(action, id) {
        try {
            const r = await fetch('/api/cron', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action, id})
            });
            const data = await r.json();
            if (!data.ok) {
                alert(data.error || data.message || '操作失败');
                return;
            }
            await loadCronView();
        } catch (e) {
            alert('操作失败: ' + e.message);
        }
    }

    async function cronAdd() {
        const name = document.getElementById('cron-name').value.trim();
        const schedule = document.getElementById('cron-schedule').value.trim();
        const prompt = document.getElementById('cron-prompt').value.trim();
        if (!schedule || !prompt) {
            alert('schedule 和 prompt 不能为空');
            return;
        }
        try {
            const r = await fetch('/api/cron', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'add', name, schedule, prompt})
            });
            const data = await r.json();
            if (!data.ok) {
                alert(data.error || '添加失败');
                return;
            }
            await loadCronView();
        } catch (e) {
            alert('添加失败: ' + e.message);
        }
    }

    // ===== INPUT HANDLING =====
    $input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
        if (e.key === 'l' && e.ctrlKey) {
            e.preventDefault();
            clearSession();
        }
        if (e.key === 'n' && e.ctrlKey) {
            e.preventDefault();
            newSession();
        }
    });

    $input.addEventListener('input', () => {
        $input.style.height = 'auto';
        $input.style.height = Math.min($input.scrollHeight, 120) + 'px';
    });

    // auto-resize
    function autoResize() {
        $input.style.height = 'auto';
        $input.style.height = Math.min($input.scrollHeight, 120) + 'px';
    }
</script>
</body>
</html>

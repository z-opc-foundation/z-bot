# z-bot 通道注册表缺省档（随 jar 走；ChannelRegistry.BUILTIN_RESOURCE）
#
# 形状声明：四种内置 kind 都能被 manifest 引用，但 IM 通道默认 enabled=false ——
# 凭据不随包发，必须由 <configDir>/channels.properties（--config-dir / ZBOT_HOME 指向的数据根）
# 显式打开。后写覆盖：profile manifest 覆盖本档同名字段，CLI 覆盖 profile manifest。
#
# 广告出去的字段都有兑现路径：
#   requires      -> ChannelRegistry.create() 逐键检查，缺键抛 ChannelConfigException 并点名缺哪个
#   default-port  -> Context.port() 在 CLI/config 都没给端口时用它
#   outbound      -> ChannelRegistry.isOutbound() 决定该通道能不能当 cron/fan-out 的投递目标

# ---- 浏览器拉模式控制台：没有"主动推"的接口，所以 outbound=false ----
# 端口不写进 requires：它由 --port(CLI) > channel.http.config.port > default-port 三层解析，
# 写进 requires 反而会让 default-port 这条兑现路径永远走不到（工厂里的缺键检查兜住真缺的情况）。
channel.http.kind=http
channel.http.enabled=true
channel.http.outbound=false
channel.http.default-port=8080

# ---- 通用 webhook 入站 + 出站轮询 ----
channel.webhook.kind=webhook
channel.webhook.enabled=true
channel.webhook.outbound=true
channel.webhook.default-port=8090

# ---- 飞书：出站真发 tenant_access_token + im/v1/messages ----
channel.feishu.kind=feishu
channel.feishu.enabled=false
channel.feishu.outbound=true
channel.feishu.default-port=9101
channel.feishu.requires=app-id,app-secret
channel.feishu.config.api-base=https://open.feishu.cn/open-apis
channel.feishu.config.receive-id-type=open_id

# ---- 钉钉：出站真发加签群机器人 webhook ----
channel.dingtalk.kind=dingtalk
channel.dingtalk.enabled=false
channel.dingtalk.outbound=true
channel.dingtalk.default-port=9102
channel.dingtalk.requires=webhook-url

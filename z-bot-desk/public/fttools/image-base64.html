<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图片 Base64 · FT 工具</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 16px 20px 24px; color: #1f2329; background: #fff; font-size: 13px; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .desc { color: #7a8199; font-size: 12px; margin-bottom: 12px; }
  .sec { margin-top: 12px; }
  label.fl { display: block; font-size: 12px; color: #5a6478; margin-bottom: 4px; font-weight: 500; }
  textarea, input[type=text], input[type=number], select {
    width: 100%; border: 1px solid #dfe3ec; border-radius: 8px; padding: 8px 10px; font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; outline: none; background: #fff;
  }
  textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
  textarea:focus, input:focus, select:focus { border-color: #2f6bff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .row > * { flex: 0 0 auto; }
  .grow { flex: 1 1 160px !important; }
  button {
    border: none; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer;
    background: #eef1f7; color: #2a3245; font-family: inherit;
  }
  button:hover { background: #e2e7f2; }
  button.primary { background: #2f6bff; color: #fff; }
  button.primary:hover { background: #2559e0; }
  .out {
    margin-top: 10px; background: #f6f8fb; border: 1px solid #e8ecf4; border-radius: 8px;
    padding: 10px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap;
    word-break: break-all; max-height: 300px; overflow: auto; line-height: 1.55;
  }
  .out:empty { display: none; }
  .out.dln { white-space: pre; }
  .ok { color: #16a34a; } .bad { color: #dc2626; } .muted { color: #8a92a6; }
  .kv { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .kv div { background: #f6f8fb; border-radius: 8px; padding: 6px 10px; font-size: 12px; }
  .kv b { display: block; font-size: 15px; font-weight: 600; }
  .chk { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; margin-right: 10px; }
  .swatch { width: 88px; height: 44px; border-radius: 8px; border: 1px solid #e2e6ef; vertical-align: middle; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td, th { border: 1px solid #e8ecf4; padding: 5px 8px; text-align: left; }
  th { background: #f6f8fb; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: #1f2329; color: #fff; font-size: 12px; padding: 7px 14px; border-radius: 16px;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: .92; }
</style>
</head>
<body>
<h1>🖼️ 图片 Base64</h1>
<div class="desc">图片 ↔ data URL，可复制引用</div>

<div class="sec"><label class="fl">选择图片</label><input type="file" id="file" accept="image/*" style="font-size:12px"></div>
<div class="row"><label class="fl" style="margin:0">或输入 data URL：</label></div>
<div class="sec"><textarea id="in" placeholder="data:image/png;base64,…"></textarea>
<div class="row"><button class="primary" id="prev">预览</button><button id="cp">复制 data URL</button></div></div>
<div class="sec"><div id="pv"></div><div class="out" id="info"></div></div>

<div class="toast" id="toast"></div>
<script>
var $ = function (s) { return document.querySelector(s); };
var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
var _tt;
function toast(m) { var t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(_tt); _tt = setTimeout(function () { t.classList.remove("show"); }, 1600); }
function copy(t, m) {
  var done = function () { toast(m || "已复制"); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done, function () { legacy(); });
  } else { legacy(); }
  function legacy() {
    var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta);
    ta.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("复制失败"); } ta.remove();
  }
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function download(name, text) {
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
  a.download = name; a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 500);
}
try { var __T = window.parent && window.parent.__TAURI__; if (__T) window.__TAURI__ = __T; } catch (e) {}
</script>
<script>

$("#file").onchange = function () {
  var f = this.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    $("#in").value = r.result; show(r.result);
  };
  r.readAsDataURL(f);
};
function show(u) {
  var img = new Image();
  img.onload = function () {
    $("#pv").innerHTML = "";
    img.style.maxWidth = "220px"; img.style.borderRadius = "8px"; img.style.border = "1px solid #e8ecf4";
    $("#pv").appendChild(img);
    $("#info").textContent = "尺寸 " + img.naturalWidth + "×" + img.naturalHeight + " · data URL 长度 " + u.length + " 字符";
  };
  img.onerror = function () { $("#pv").innerHTML = '<span class="bad">无法解析为图片</span>'; $("#info").textContent = ""; };
  img.src = u;
}
$("#prev").onclick = function () { var v = $("#in").value.trim(); if (v) show(v); };
$("#cp").onclick = function () { var v = $("#in").value.trim(); if (v) copy(v); };

</script>
</body>
</html>

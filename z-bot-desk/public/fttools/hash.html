<!doctype html>

  .kv b { display: block; font-size: 15px; font-weight: 600; }

  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td, th { border: 1px solid #e8ecf4; padding: 5px 8px; text-align: left; }
  th { background: #f6f8fb; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: #1f2329; color: #fff; font-size: 12px; padding: 7px 14px; border-radius: 16px;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: .92; }
</style>
</head>
<body>
<h1>#️⃣ 哈希计算</h1>
<div class="desc">MD5 / SHA-1 / SHA-256 / SHA-512 摘要</div>

<div class="sec"><label class="fl">输入</label><textarea id="in" placeholder="输入文本…"></textarea></div>
<div class="row"><button class="primary" id="go">计算</button><span class="muted" id="tip"></span></div>
<div class="out" id="out" style="display:none"></div>

<div class="toast" id="toast"></div>

$("#go").onclick = function () {
  var s = $("#in").value, out = $("#out");
  out.style.display = "";
  var lines = ["MD5      " + hexs(md5(s))];
  var done = 0;
  ["SHA-1", "SHA-256", "SHA-512"].forEach(function (name) {
    var algo = name.replace("-", "").toLowerCase();
    crypto.subtle.digest(algo, new TextEncoder().encode(s)).then(function (buf) {
      lines.push(name.padEnd(8, " ") + hexs(new Uint8Array(buf)));

  });
  out.textContent = lines.join("\n");
};
